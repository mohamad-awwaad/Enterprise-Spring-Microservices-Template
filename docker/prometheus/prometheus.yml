global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # BFF Service - actuator is served on the separate management port (default 9081), not the
  # public port (8081), so it isn't exposed alongside the public API.
  - job_name: 'bff'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9081']
      - targets: ['bff:9081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'bff'

  # Gateway Service - actuator on the separate management port (default 9888).
  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9888']
      - targets: ['gateway:9888']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'gateway'

  # Profile Service - actuator on the separate management port (default 9082).
  - job_name: 'profile-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9082']
      - targets: ['profile-service:9082']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'profile-service'

  # Order Service - actuator on the separate management port (default 9083).
  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9083']
      - targets: ['order-service:9083']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'order-service'

  # Keycloak Admin Service - actuator on the separate management port (default 9084).
  - job_name: 'keycloak-admin-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9084']
      - targets: ['keycloak-admin-service:9084']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'keycloak-admin-service'
