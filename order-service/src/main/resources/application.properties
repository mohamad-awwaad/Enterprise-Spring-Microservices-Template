server.port=8083
spring.threads.virtual.enabled=true
# Resource-server settings (issuer-uri, audiences) come from common-security's
# ResourceServerDefaultsEnvironmentPostProcessor; set KEYCLOAK_ISSUER_URI / API_AUDIENCE or
# override the spring.security.oauth2.resourceserver.jwt.* keys here if this service differs.

# Postgres Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/order_db}
spring.datasource.username=${DATABASE_USERNAME:order_user}
# WARNING: Change this password in production!
spring.datasource.password=${DATABASE_PASSWORD:order_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway manages the schema now (see src/main/resources/db/migration). baseline-on-migrate
# lets existing dev databases that were created by ddl-auto=update (pre-Flyway) be baselined
# at version 1 so only V2+ migrations run against them.
spring.flyway.baseline-on-migrate=true

# Actuator - served on a separate port so it isn't exposed alongside the public API
management.server.port=${MANAGEMENT_PORT:9083}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# OpenAPI (accessible via /orders/public/api-docs through gateway)
springdoc.api-docs.path=/api/public/api-docs
springdoc.swagger-ui.path=/api/public/swagger-ui.html

# Distributed Tracing
spring.application.name=order-service
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# Resource Server Security (auto-configured via common-security)
security.resource-server.public-endpoints=/api/public/**

# Serialize Page results as a stable DTO ({content, page{size,number,totalElements,totalPages}})
# instead of PageImpl's internal shape.
spring.data.web.pageable.serialization-mode=via_dto
