server.port=8082
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/my-realm}
# Reject tokens that aren't meant for this API surface (e.g. a token minted for an unrelated
# client without the shared audience mapper) - see realm's oidc-audience-mapper.
spring.security.oauth2.resourceserver.jwt.audiences=${API_AUDIENCE:template-api}

# Postgres Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/profile_db}
spring.datasource.username=${DATABASE_USERNAME:profile_user}
# WARNING: Change this password in production!
spring.datasource.password=${DATABASE_PASSWORD:profile_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway manages the schema now (see src/main/resources/db/migration). baseline-on-migrate
# lets existing dev databases that were created by ddl-auto=update (pre-Flyway) be baselined
# at version 1 so only V2+ migrations run against them.
spring.flyway.baseline-on-migrate=true

# Keycloak Admin Service Integration
keycloak.admin-service.url=${KEYCLOAK_ADMIN_SERVICE_URL:http://localhost:8084/api}

# OAuth2 client registration used solely to obtain a client-credentials token for the
# now-authenticated /api/users/register call on keycloak-admin-service (see KeycloakAdminClient).
spring.security.oauth2.client.registration.internal.client-id=${INTERNAL_CLIENT_ID:internal-client}
spring.security.oauth2.client.registration.internal.client-secret=${INTERNAL_CLIENT_SECRET:my-internal-secret}
spring.security.oauth2.client.registration.internal.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.internal.provider=keycloak
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/my-realm}

# HTTP client timeouts applied to Boot's auto-configured RestClient.Builder (used by KeycloakAdminClient)
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=10s

# Registration Configuration
app.registration.token-expiry-hours=24
app.registration.confirmation-base-url=${REGISTRATION_CONFIRMATION_URL:http://localhost:4200/confirm}

# Actuator - served on a separate port so it isn't exposed alongside the public API
management.server.port=${MANAGEMENT_PORT:9082}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# OpenAPI (accessible via /profile/public/api-docs through gateway)
springdoc.api-docs.path=/api/public/api-docs
springdoc.swagger-ui.path=/api/public/swagger-ui.html

# Distributed Tracing
spring.application.name=profile-service
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# Resource Server Security (auto-configured via common-security)
security.resource-server.public-endpoints=/api/public/**
