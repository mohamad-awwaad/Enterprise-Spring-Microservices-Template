server {
    listen 4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the SPA. nginx does NOT inherit add_header directives into a
    # location block that defines its own add_header set, so the same headers are repeated
    # verbatim on the /bff/ location below rather than relying on inheritance from here.
    #
    # CSP notes:
    # - script-src has no 'unsafe-inline': the app ships no inline scripts (see index.html).
    # - style-src needs 'unsafe-inline' for Angular Material (CDK overlay/ripple styles are
    #   injected inline at runtime).
    # - font-src allows data: because the production build inlines Google Fonts (Angular CLI's
    #   default font-inlining) as data URIs instead of fetching fonts.googleapis.com/gstatic.com
    #   at runtime.
    # - connect-src is 'self' only: the app talks to the BFF through the /bff/ proxy below.
    # - form-action: AuthService.logout() submits a real (top-level) form POST to /bff/logout,
    #   which redirects to the BFF origin and on to Keycloak's logout endpoint. Chrome checks
    #   form-action against those redirects too, so the BFF and Keycloak origins are listed
    #   (localhost:8080 for the host-run setup, keycloak:8080 for the full Docker stack).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8081 http://localhost:8080 http://keycloak:8080" always;

    # Angular SPA - let client-side routing handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to the BFF service. The Host header is pinned to localhost:8081
    # (the same host:port the BFF is also published on) so the BFF builds its
    # OAuth2 redirect/callback URIs the same way the Angular dev proxy does
    # (see angular-ui/proxy.conf.json, changeOrigin: true) - the BFF's Keycloak
    # client is registered with a localhost:8081 redirect URI.
    location /bff/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8081 http://localhost:8080 http://keycloak:8080" always;

        proxy_pass http://bff:8081/bff/;
        proxy_set_header Host localhost:8081;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }
}
