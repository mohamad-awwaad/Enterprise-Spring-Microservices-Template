server.port=8084
spring.threads.virtual.enabled=true

# Resource-server settings (issuer-uri, audiences) come from common-security's
# ResourceServerDefaultsEnvironmentPostProcessor; set KEYCLOAK_ISSUER_URI / API_AUDIENCE or
# override the spring.security.oauth2.resourceserver.jwt.* keys here if this service differs.

# Keycloak Admin Client Credentials (Service Account)
keycloak.admin.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8080}
keycloak.admin.realm=${KEYCLOAK_REALM:my-realm}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-service-client}
# WARNING: Change this secret in production! Default matches pre-configured Keycloak realm.
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:admin-secret}

# Actuator - served on a separate port so it isn't exposed alongside the public API
management.server.port=${MANAGEMENT_PORT:9084}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState

# Distributed Tracing
spring.application.name=keycloak-admin-service
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# Resource Server Security (auto-configured via common-security)
# /api/users/register is no longer public: it now requires an INTERNAL_SERVICE-role bearer
# token (see AdminController.registerUser's @PreAuthorize and the internal-client service
# account in the realm export).
