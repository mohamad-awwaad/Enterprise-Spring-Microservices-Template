stages:
  - build
  - test
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

build:
  stage: build
  image: maven:3.9-eclipse-temurin-25
  cache:
    key: maven-repo
    paths:
      - .m2/repository
  script:
    - ./mvnw -B -ntp -DskipTests package
  artifacts:
    paths:
      - "**/target/*.jar"
    expire_in: 1 day

frontend:
  stage: build
  image: node:24
  cache:
    key: npm-cache
    paths:
      - angular-ui/node_modules
  script:
    - cd angular-ui
    - npm ci
    - npm test
    - npm run build
  artifacts:
    paths:
      - angular-ui/dist
    expire_in: 1 day

# Browser end-to-end tests (Playwright). They need a running stack (Angular UI, BFF, gateway,
# services, Keycloak with the test user), so this job is manual: set E2E_BASE_URL to an
# environment where the stack is reachable, or run `npm run e2e` locally against
# `docker compose --profile apps up`.
frontend-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  needs: ["frontend"]
  when: manual
  allow_failure: true
  variables:
    E2E_BASE_URL: "http://localhost:4200"
  cache:
    key: npm-cache
    paths:
      - angular-ui/node_modules
  script:
    - cd angular-ui
    - npm ci
    - npm run e2e
  artifacts:
    when: always
    paths:
      - angular-ui/playwright-report
      - angular-ui/test-results
    expire_in: 3 days

test:
  stage: test
  image: maven:3.9-eclipse-temurin-25
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  cache:
    key: maven-repo
    paths:
      - .m2/repository
  script:
    - ./mvnw -B -ntp verify
  artifacts:
    when: always
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"

docker-build:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - docker compose --profile apps build
