stages:
  - build
  - test
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

build:
  stage: build
  image: maven:3.9-eclipse-temurin-25
  cache:
    key: maven-repo
    paths:
      - .m2/repository
  script:
    - ./mvnw -B -ntp -DskipTests package
  artifacts:
    paths:
      - "**/target/*.jar"
    expire_in: 1 day

frontend:
  stage: build
  image: node:24
  cache:
    key: npm-cache
    paths:
      - angular-ui/node_modules
  script:
    - cd angular-ui
    - npm ci
    - npm run build
  artifacts:
    paths:
      - angular-ui/dist
    expire_in: 1 day

test:
  stage: test
  image: maven:3.9-eclipse-temurin-25
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  cache:
    key: maven-repo
    paths:
      - .m2/repository
  script:
    - ./mvnw -B -ntp verify -Dtest.excludedGroups=requires-keycloak
  artifacts:
    when: always
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"

docker-build:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - docker compose --profile apps build
